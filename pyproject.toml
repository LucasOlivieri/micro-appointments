[project]
name = "micro-appointments"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "LucasOlivieri", email = "wukka17@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "asttokens>=3.0.2",
    "aiogram>=3.0.0",
    "comm>=0.2.3",
    "fastapi>=0.115.0",
    "google-api-python-client>=2.0.0",
    "google-auth>=2.0.0",
    "google-auth-oauthlib>=1.0.0",
    "httpx>=0.27.0",
    "openai-agents>=0.2.0",
    "python-dateutil>=2.9.0",
    "python-dotenv>=1.0.0",
    "questionary>=2.1.0",
    "sqlite-utils>=4.2.1",
    "typer==0.27.1",
    "tzlocal>=5.0",
    "uvicorn>=0.30.0",
    "python-dotenv>=1.2.3",
]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pre-commit>=4.6.2",
    "ruff>=0.16.5",
]
test = [
    "ipykernel>=7.1.0",
    "jupyter>=1.1.1",
    "pytest>=9.1.1",
    "gradio>=5.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.uv]
package = false

[project.scripts]
micro-appointments = "micro_appointments:main"
appointments-agent = "bot.main:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[tool.black]
line-length = 88
target-version = ["py314"]

[tool.ruff]
line-length = 88
target-version = "py314"
exclude = [
    ".venv",
    "backups",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
explicit_package_bases = true
python_version = "3.14"
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
exclude = ["tests/"]
