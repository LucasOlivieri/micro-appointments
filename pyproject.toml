[project]
name = "micro-appointments"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "LucasOlivieri", email = "wukka17@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "asttokens>=3.0.2",
    "comm>=0.2.3",
    "fastapi>=0.115.0",
    "gradio>=5.0.0",
    "httpx>=0.27.0",
    "openai-agents>=0.2.0",
    "python-dotenv>=1.0.0",
    "sqlite-utils>=4.2.1",
    "tzlocal>=5.0",
    "uvicorn>=0.30.0",
]

[dependency-groups]
test = [
    "ipykernel>=7.1.0",
    "jupyter>=1.1.1",
    "pytest>=9.0.2",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.uv]
package = false

[project.scripts]
micro-appointments = "micro_appointments:main"
appointments-agent = "bot.main:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"
